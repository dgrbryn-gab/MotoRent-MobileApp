name: moto_rent_dumaguete
description: A motorcycle rental app for Dumaguete with premium dark theme and neon accents.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # HTTP and Networking
  http: ^1.2.0
  dio: ^5.4.0
  
  # Image Handling
  image_picker: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Date and Time
  intl: ^0.20.2
  
  # Maps and Location (Optional - commented out to avoid issues)
  # google_maps_flutter: ^2.5.3
  # location: ^5.0.3
  # geolocator: ^10.1.0
  
  # File Handling
  path_provider: ^2.1.2
  
  # Utilities
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  
  # Animations
  lottie: ^3.0.0
  
  # Camera (Optional - commented out to avoid compatibility issues)
  # camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  # Optionally, you can also set adaptive icons for Android
  adaptive_icon_background: "#FF7A00"  # Your secondary color (orange)
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/